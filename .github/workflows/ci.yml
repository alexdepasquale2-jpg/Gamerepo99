name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  game:
    name: game check, build, saves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run game:check
      - name: Build
        run: npm run game:build
      - name: Old saves still load
        run: npm run game:check-saves
